<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vanilla JavaScriptで作成したタスク管理ブラウザアプリのデモ"
    />
    <title>Focus Board | JavaScript Demo</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">VANILLA JAVASCRIPT DEMO</p>
          <h1>Focus Board</h1>
          <p class="hero-copy">
            今日やることを整理して、ひとつずつ完了させましょう。
          </p>
        </div>
        <button id="reset-demo" class="button button-ghost" type="button">
          デモを初期状態に戻す
        </button>
      </header>

      <main>
        <section class="summary-grid" aria-label="タスクの概要">
          <article class="summary-card summary-card-primary">
            <span>進捗</span>
            <strong id="progress-value">0%</strong>
            <div class="progress-track" aria-hidden="true">
              <div id="progress-bar" class="progress-bar"></div>
            </div>
          </article>
          <article class="summary-card">
            <span>すべて</span>
            <strong id="total-count">0</strong>
          </article>
          <article class="summary-card">
            <span>未完了</span>
            <strong id="active-count">0</strong>
          </article>
          <article class="summary-card">
            <span>完了</span>
            <strong id="completed-count">0</strong>
          </article>
        </section>

        <section class="workspace">
          <aside class="task-creator">
            <div class="section-heading">
              <p class="eyebrow">NEW TASK</p>
              <h2>タスクを追加</h2>
            </div>

            <form id="task-form" class="task-form">
              <label>
                タスク名
                <input
                  id="task-title"
                  name="title"
                  type="text"
                  maxlength="80"
                  placeholder="例：発表資料を仕上げる"
                  required
                />
              </label>

              <div class="form-row">
                <label>
                  優先度
                  <select id="task-priority" name="priority">
                    <option value="high">高</option>
                    <option value="medium" selected>中</option>
                    <option value="low">低</option>
                  </select>
                </label>

                <label>
                  期限
                  <input id="task-due-date" name="dueDate" type="date" />
                </label>
              </div>

              <button class="button button-primary" type="submit">
                タスクを追加
              </button>
            </form>

            <div class="learning-note">
              <span>観察ポイント</span>
              <p>
                機能が増えるほど、データ・DOM操作・イベント処理の関係がどう変わるか確認します。
              </p>
            </div>
          </aside>

          <section class="task-panel" aria-labelledby="task-list-title">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">TASKS</p>
                <h2 id="task-list-title">タスク一覧</h2>
              </div>
              <button id="clear-completed" class="text-button" type="button">
                完了済みを削除
              </button>
            </div>

            <div class="controls">
              <label class="search-field">
                <span class="sr-only">タスクを検索</span>
                <input
                  id="search-input"
                  type="search"
                  placeholder="タスクを検索"
                />
              </label>

              <div id="status-filters" class="filter-tabs" aria-label="状態で絞り込み">
                <button type="button" data-status="all" aria-pressed="true">すべて</button>
                <button type="button" data-status="active" aria-pressed="false">未完了</button>
                <button type="button" data-status="completed" aria-pressed="false">完了</button>
              </div>

              <div class="select-controls">
                <label>
                  <span>優先度</span>
                  <select id="priority-filter">
                    <option value="all">すべて</option>
                    <option value="high">高</option>
                    <option value="medium">中</option>
                    <option value="low">低</option>
                  </select>
                </label>

                <label>
                  <span>並び順</span>
                  <select id="sort-order">
                    <option value="created">新しい順</option>
                    <option value="due">期限が近い順</option>
                    <option value="priority">優先度順</option>
                  </select>
                </label>
              </div>
            </div>

            <p id="result-summary" class="result-summary" aria-live="polite"></p>

            <ul id="task-list" class="task-list"></ul>

            <div id="empty-state" class="empty-state" hidden>
              <div class="empty-icon" aria-hidden="true">✓</div>
              <h3>表示するタスクがありません</h3>
              <p>条件を変更するか、新しいタスクを追加してください。</p>
            </div>
          </section>
        </section>
      </main>
    </div>

    <dialog id="edit-dialog" class="edit-dialog">
      <form id="edit-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">EDIT TASK</p>
            <h2>タスクを編集</h2>
          </div>
          <button id="close-dialog" class="icon-button" type="button" aria-label="閉じる">
            ×
          </button>
        </div>

        <input id="edit-task-id" name="id" type="hidden" />

        <label>
          タスク名
          <input id="edit-title" name="title" type="text" maxlength="80" required />
        </label>

        <div class="form-row">
          <label>
            優先度
            <select id="edit-priority" name="priority">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </label>

          <label>
            期限
            <input id="edit-due-date" name="dueDate" type="date" />
          </label>
        </div>

        <div class="dialog-actions">
          <button id="cancel-edit" class="button button-secondary" type="button">
            キャンセル
          </button>
          <button class="button button-primary" value="save" type="submit">
            変更を保存
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
